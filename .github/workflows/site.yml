name: Site

# Publishes the download page (site/) plus LICENSE.txt and THIRD-PARTY-NOTICES.txt to the
# gh-pages branch of the public releases repo, which serves it with GitHub Pages.
# Runs when any of those change on main, or by hand from the Actions tab.
# Needs the RELEASES_TOKEN secret (see RELEASING.md). Skipped until it's set.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "LICENSE.txt", "THIRD-PARTY-NOTICES.txt", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push the page to gh-pages
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO || 'elgore319/belay' }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN isn't set, so the page wasn't published. See RELEASING.md."
            exit 0
          fi
          OUT="$(mktemp -d)"
          cp -r site/. "$OUT/"
          cp LICENSE.txt THIRD-PARTY-NOTICES.txt "$OUT/"
          touch "$OUT/.nojekyll"
          cd "$OUT"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA::7}"
          # Only the built page goes to the public repo; its history is replaced each time.
          git push -qf "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" gh-pages
          echo "Published to https://github.com/${PUBLIC_REPO}/tree/gh-pages"
